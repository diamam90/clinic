server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: client
          uri: http://localhost:8081
          predicates:
            - Path=/client-service/**
          filters:
            - RewritePath=/client-service/?(?<segment>.*), /$\{segment}
        - id: doctor
          uri: http://localhost:8082
          predicates:
            - Path=/doctor-service/**
          filters:
            - RewritePath=/doctor-service/?(?<segment>.*), /$\{segment}
        - id: appointment
          uri: http://localhost:8083
          predicates:
            - Path=/appointment-service/**
          filters:
            - RewritePath=/appointment-service/?(?<segment>.*), /$\{segment}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: gateway-service
        url: /v3/api-docs
      - name: client-service
        url: /client-service/v3/api-docs
      - name: doctor-service
        url: /doctor-service/v3/api-docs
      - name: appointment-service
        url: /appointment-service/v3/api-docs

management:
  tracing:
    sampling:
      probability: 1.0