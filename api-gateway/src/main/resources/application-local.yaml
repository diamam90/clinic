server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: client
          uri: http://localhost:8081
          predicates:
            - Path=/client-service/**
        - id: doctor
          uri: http://localhost:8082
          predicates:
            - Path=/doctor-service/**
        - id: appointment
          uri: http://localhost:8083
          predicates:
            - Path=/appointment-service/**

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: gateway-service
        url: /v3/api-docs
      - name: client-service
        url: /client-service/v3/api-docs
      - name: doctor-service
        url: /doctor-service/v3/api-docs
      - name: appointment-service
        url: /appointment-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus