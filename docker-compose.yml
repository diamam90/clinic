services:
  broker1:
    image: confluentinc/cp-kafka:7.5.3
    container_name: br1
    ports:
      - 9092:9092
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeep:2181
      KAFKA_BROKER_ID: 228
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,CLIENT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INSIDE://br1:29092,CLIENT://localhost:9092
      KAFKA_LISTENERS: INSIDE://br1:29092,CLIENT://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
    depends_on:
      - zookeeper

  broker2:
    image: confluentinc/cp-kafka:7.5.3
    container_name: br2
    ports:
      - 9093:9092
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeep:2181
      KAFKA_BROKER_ID: 229
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,CLIENT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INSIDE://br2:29092,CLIENT://localhost:9093
      KAFKA_LISTENERS: INSIDE://br2:29092,CLIENT://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
    depends_on:
      - zookeeper

  broker3:
    image: confluentinc/cp-kafka:7.5.3
    container_name: br3
    ports:
      - 9094:9092
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeep:2181
      KAFKA_BROKER_ID: 230
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,CLIENT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INSIDE://br3:29092,CLIENT://localhost:9094
      KAFKA_LISTENERS: INSIDE://br3:29092,CLIENT://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeep
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  mongo:
    image: mongo:8.0.4
    container_name: mongo-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: clinic
    ports:
      - 27017:27017
    volumes:
      - ./init-mongo.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  postgres:
    image: postgres:17.4
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: clinic
    ports:
      - 5432:5432
