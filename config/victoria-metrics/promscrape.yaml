scrape_configs:
  - job_name: api_gateway
    static_configs:
      - targets: [ "http://host.docker.internal:8080" ]
    metrics_path: /actuator/prometheus
  - job_name: client_service
    static_configs:
      - targets: [ "http://host.docker.internal:8081" ]
    metrics_path: /actuator/prometheus
  - job_name: doctor_service
    static_configs:
      - targets: [ "http://host.docker.internal:8082" ]
    metrics_path: /actuator/prometheus
  - job_name: appointment_service
    static_configs:
      - targets: [ "http://host.docker.internal:8083" ]
    metrics_path: /actuator/prometheus